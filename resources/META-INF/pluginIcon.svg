<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">The Rain Song</title>
  <desc id="desc">A guitar pick containing a rain drop and four muted seasonal accents.</desc>

  <!-- Guitar pick silhouette. -->
  <path d="M512 116 C618 150 738 190 806 284 Q830 320 808 370 L638 744 Q602 824 512 912 Q422 824 386 744 L216 370 Q194 320 218 284 C286 190 406 150 512 116Z"
        fill="#1C1E22" stroke="#AEB5BE" stroke-width="18" stroke-linejoin="round"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Seasonal accents: spring, summer, autumn, winter. -->
    <path d="M318 306 Q374 224 464 188" stroke="#B98296" stroke-width="18"/>
    <path d="M560 188 Q650 224 706 306" stroke="#CC9870" stroke-width="18"/>
    <path d="M706 718 Q650 800 560 836" stroke="#B1A976" stroke-width="18"/>
    <path d="M464 836 Q374 800 318 718" stroke="#9BB8C8" stroke-width="18"/>
  </g>

  <!-- Rain drop / negative-space center. -->
  <path d="M512 300 C484 338 454 372 454 412 C454 454 480 480 512 480 C544 480 570 454 570 412 C570 372 540 338 512 300Z"
        fill="#3A4048" stroke="#DADBDC" stroke-width="12" stroke-linejoin="round"/>

  <!-- Small strings reinforce the musical reference without adding clutter. -->
  <g stroke="#69727B" stroke-width="10">
    <path d="M450 560 V760"/>
    <path d="M490 570 V790"/>
    <path d="M534 570 V790"/>
    <path d="M574 560 V760"/>
  </g>
</svg>
